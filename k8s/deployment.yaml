apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-backend
  namespace: food-delivery-prod
  labels:
    app: food-delivery-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-delivery-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: food-delivery-backend
    spec:
      containers:
      - name: spring-boot-app
        image: your-registry/food-delivery-backend:latest
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        envFrom:
        - configMapRef:
            name: food-delivery-config
        - secretRef:
            name: food-delivery-secrets
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
