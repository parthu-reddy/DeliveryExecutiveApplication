apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: food-delivery-backend
  name: food-delivery-backend
  namespace: food-delivery-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-delivery-backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: food-delivery-backend
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: food-delivery-config
        - secretRef:
            name: food-delivery-secrets
        image: your-registry/food-delivery-backend:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        name: spring-boot-app
        ports:
        - containerPort: 8080
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
