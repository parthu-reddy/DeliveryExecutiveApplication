spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: delivery-service
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
      circuitbreaker:
        enabled: true
        alphanumeric-ids: true
springdoc:
  packages-to-scan: com.fooddelivery.delivery,com.fooddelivery.common.dto.governmentid
resilience4j:
  retry:
    instances:
      restaurant-service:
        baseConfig: default
      customer-service:
        baseConfig: default
      wallet-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
  circuitbreaker:
    instances:
      restaurant-service:
        baseConfig: default
      customer-service:
        baseConfig: default
      wallet-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
  timelimiter:
    instances:
      restaurant-service:
        baseConfig: default
      customer-service:
        baseConfig: default
      wallet-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
verification:
  vahan:
    api:
      url: https://api.mock-vahan.gov.in/rc/verify
      key: mock-api-key
      timeout-seconds: 10
  sarathi:
    api:
      url: https://api.mock-sarathi.gov.in/dl/verify
      key: mock-api-key
      timeout-seconds: 10
